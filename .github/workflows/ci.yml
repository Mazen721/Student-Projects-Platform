name: CI

on:
  push:
    branches: [main, '001-student-projects-platform']
  pull_request:
    branches: [main]

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm --workspace shared test
      - run: npm --workspace client test
      - run: npm --workspace server test

  coverage-gate:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm install --no-save @vitest/coverage-v8@3.0.5
      - name: Check >= 90% coverage on shared calc & state machines
        run: >
          npx --workspace shared vitest run --coverage.enabled --coverage.provider=v8
          --coverage.include="src/calc/**" --coverage.include="src/machines/**"
          --coverage.thresholds.lines=90 --coverage.thresholds.statements=90
          --coverage.thresholds.functions=90
      - name: Check >= 90% coverage on server core/authz
        run: >
          npx --workspace server vitest run tests/unit/authz.test.js tests/authz/full-matrix.test.js
          --coverage.enabled --coverage.provider=v8
          --coverage.include="src/core/authz/**"
          --coverage.thresholds.lines=90 --coverage.thresholds.statements=90
          --coverage.thresholds.functions=90

  build-and-bundle-budget:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Build client with production API URL validation
        env:
          REQUIRE_VITE_API_URL: 'true'
          VITE_API_URL: 'https://api.example.edu.eg'
        run: npm --workspace client run build
      - name: Verify public initial JS bundle <= 180 KB gzip
        run: node e2e/perf/check-bundle-budget.js

  e2e-and-a11y:
    runs-on: ubuntu-latest
    needs: [coverage-gate, build-and-bundle-budget]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Build client for E2E preview
        env:
          VITE_API_URL: 'http://localhost:4100'
        run: npm --workspace client run build
      - name: Run Playwright E2E, WCAG 2.1 AA, Arabic-only & Perf suites
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
